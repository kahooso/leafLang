<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/contact.css">
    <link rel="stylesheet" href="/static/css/all.css">
    <link rel="shortcut icon" href="/static/images/logo.ico" type="image/x-icon">
    <title>Contact Us | leafLang</title>

<body class="contact-page">
    <div class="header">
        <h2><i class="fas fa-leaf"></i> Contact leafLang</h2>
        <p>We're here to help with your language learning journey</p>
    </div>

    <div class="contact-container">
        <div class="contact-info">
            <div class="contact-card">
                <i class="fas fa-headset contact-icon"></i>
                <h3>Learning Support</h3>
                <p>+7 (911) 094-3172</p>
                <p>Available 9am-9pm EST</p>
            </div>

            <div class="contact-card">
                <i class="fas fa-envelope contact-icon"></i>
                <h3>Email Us</h3>
                <p>nanachi112@icloud.com</p>
                <p>Response within 24 hours</p>
            </div>

            <div class="contact-card">
                <i class="fas fa-globe-americas contact-icon"></i>
                <h3>Join Our Community</h3>
                <p>http://localhost:8080/</p>
                <p>Connect with other learners</p>
            </div>
        </div>
    </div>

    <div class="button-container">
        <a href="/main"><button class="back-button"><i class="fas fa-arrow-left"></i> Back to Learning</button></a>
    </div>
