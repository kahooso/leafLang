<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/all.css">
    <link rel="shortcut icon" href="/static/images/logo.ico" type="image/x-icon">
    <title>Sign In | leafLang</title>
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h2><i class="fas fa-leaf"></i> Welcome to leafLang</h2>
            <p>Please sign in to continue your language journey</p>
        </div>

        <form id="SignInForm" action="/auth/signin" method="post" class="auth-form">
            <div class="input-group">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="SignInEmail" placeholder="Your Email" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="SignInPassword" placeholder="Your Password" required>
            </div>

            <button type="submit" class="auth-button">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="auth-footer">
            <p>New to leafLang? <a href="/signup" class="text-link"><i class="fas fa-user-plus"></i> Create account</a>
            </p>
            <p id="SignInMsg"></p>
        </div>
    </div>

    <script src="/static/scripts/signin.js"></script>
</body>

</html>
