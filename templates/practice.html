<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Practice | Leaflang</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/practice.css">
    <link rel="stylesheet" href="/static/css/all.css">
    <link rel="shortcut icon" href="/static/images/logo.ico" type="image/x-icon">
</head>

<body class="practice-page">
    <div class="practice-container">
        <header class="practice-header">
            <h1><i class="fas fa-brain"></i> Word Practice</h1>
            <div class="progress-info">
                <div class="progress">
                    <div id="progress-bar" class="progress-bar" role="progressbar"></div>
                </div>
                <span id="progress-text">0/0</span>
            </div>
        </header>

        <div id="no-words-message" class="empty-state">
            <i class="fas fa-check-circle"></i>
            <h3>No words to practice right now!</h3>
            <p>Come back later or add more words to your list.</p>
            <a href="/words" class="btn-primary">Go to Word List</a>
        </div>

        <div id="practice-content" class="practice-content">
            <!-- Карточка с вопросом будет здесь -->
        </div>

        <div class="practice-actions">
            <button id="check-btn" class="btn-primary" disabled>
                <i class="fas fa-check"></i> Check Answer
            </button>
            <button id="next-btn" class="btn-secondary" disabled>
                Next <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div id="result-toast" class="result-toast"></div>

    <script src="/static/scripts/practice.js"></script>
</body>

</html>
