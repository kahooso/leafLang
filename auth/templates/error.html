<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <title>{{.StatusCode}} {{.StatusText}} | leafLang</title>
</head>

<body class="error-page">
    <div class="error-container">
        <div class="error-icon">
            {{if eq .StatusCode 404}}<i class="fas fa-map-marked-alt"></i>
            {{else if eq .StatusCode 403}}<i class="fas fa-lock"></i>
            {{else if eq .StatusCode 401}}<i class="fas fa-user-lock"></i>
            {{else}}<i class="fas fa-exclamation-triangle"></i>{{end}}
        </div>

        <h1>{{.StatusCode}} <span>{{.StatusText}}</span></h1>

        <div class="error-message">
            <p>{{.Message}}</p>
            {{if eq .StatusCode 401}}
            <a href="/signin" class="error-button">Sign In</a>
            {{end}}
        </div>

        <div class="error-actions">
            <a href="/main" class="error-button">Back to Main</a>
            <a href="/contact" class="error-button secondary">Contact Support</a>
        </div>
    </div>
</body>

</html>
