<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Words | leafLang</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="word-list-page">
    <div class="container">
        <header class="word-list-header">
            <h1><i class="fas fa-book"></i> My Words</h1>
            <div class="controls">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search words...">
                    <button id="search-btn"><i class="fas fa-search"></i></button>
                </div>
                <select id="status-filter">
                    <option value="">All Statuses</option>
                    <option value="To learn">To learn</option>
                    <option value="Known">Known</option>
                    <option value="Learned">Learned</option>
                </select>
                <a href="#" id="add-word-btn" class="button primary">
                    <i class="fas fa-plus"></i> Add Word
                </a>
            </div>
        </header>

        <div class="word-list-container">
            <table id="words-table">
                <thead>
                    <tr>
                        <th>Word</th>
                        <th>Translation</th>
                        <th>Example</th>
                        <th>Status</th>
                        <th>Next Review</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Words will be loaded here via JavaScript -->
                </tbody>
            </table>

            <div class="pagination">
                <button id="prev-page" disabled><i class="fas fa-chevron-left"></i></button>
                <span id="page-info">Page 1 of 1</span>
                <button id="next-page" disabled><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="edit-word-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Edit Word</h3>
            <form id="edit-word-form">
                <input type="hidden" id="edit-word-id">
                <div class="form-group">
                    <label>Original Word</label>
                    <input type="text" id="edit-original-word" required>
                </div>
                <div class="form-group">
                    <label>Translation</label>
                    <input type="text" id="edit-translation" required>
                </div>
                <div class="form-group">
                    <label>Example (optional)</label>
                    <textarea id="edit-example"></textarea>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="edit-status">
                        <option value="1">To learn</option>
                        <option value="2">Known</option>
                        <option value="3">Learned</option>
                    </select>
                </div>
                <button type="submit" class="button primary">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let currentPage = 1;
            const limit = 20;
            let totalPages = 1;
            let currentStatus = '';
            let currentSearch = '';

            const wordsTable = document.getElementById('words-table');
            const tbody = wordsTable.querySelector('tbody');
            const prevPageBtn = document.getElementById('prev-page');
            const nextPageBtn = document.getElementById('next-page');
            const pageInfo = document.getElementById('page-info');
            const statusFilter = document.getElementById('status-filter');
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const addWordBtn = document.getElementById('add-word-btn');
            const editModal = document.getElementById('edit-word-modal');
            const editForm = document.getElementById('edit-word-form');

            function loadWords(page = 1, status = '', search = '') {
                const url = new URL('/words', window.location.origin);
                url.searchParams.append('page', page);
                url.searchParams.append('limit', limit);
                if (status) url.searchParams.append('status', status);
                if (search) url.searchParams.append('search', search);

                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            renderWords(data.data.words);
                            updatePagination(data.data.pagination);
                        }
                    })
                    .catch(error => console.error('Error:', error));
            }

            function renderWords(words) {
                tbody.innerHTML = '';

                if (words.length === 0) {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td colspan="6" class="no-words">No words found</td>`;
                    tbody.appendChild(row);
                    return;
                }

                words.forEach(word => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                <td>${word.original_word}</td>
                <td>${word.translation}</td>
                <td>${word.example || '-'}</td>
                <td><span class="status-badge ${word.status.toLowerCase().replace(' ', '-')}">${word.status}</span></td>
                <td>${word.next_review_at}</td>
                <td class="actions">
                    <button class="edit-btn" data-id="${word.id}"><i class="fas fa-edit"></i></button>
                    <button class="delete-btn" data-id="${word.id}"><i class="fas fa-trash"></i></button>
                </td>
            `;
                    tbody.appendChild(row);
                });

                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', openEditModal);
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', deleteWord);
                });
            }

            function updatePagination(pagination) {
                totalPages = pagination.pages;
                currentPage = pagination.page;

                pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
                prevPageBtn.disabled = currentPage <= 1;
                nextPageBtn.disabled = currentPage >= totalPages;
            }

            function openEditModal(e) {
                const wordId = e.currentTarget.getAttribute('data-id');

                fetch(`/words/${wordId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            const word = data.data;
                            document.getElementById('edit-word-id').value = word.id;
                            document.getElementById('edit-original-word').value = word.original_word;
                            document.getElementById('edit-translation').value = word.translation;
                            document.getElementById('edit-example').value = word.example || '';
                            document.getElementById('edit-status').value = word.status_id;

                            editModal.style.display = 'block';
                        }
                    });
            }

            function deleteWord(e) {
                if (!confirm('Are you sure you want to delete this word?')) return;

                const wordId = e.currentTarget.getAttribute('data-id');

                fetch(`/words/${wordId}`, {
                    method: 'DELETE'
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            loadWords(currentPage, currentStatus, currentSearch);
                        }
                    });
            }

            prevPageBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    loadWords(currentPage - 1, currentStatus, currentSearch);
                }
            });

            nextPageBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    loadWords(currentPage + 1, currentStatus, currentSearch);
                }
            });

            statusFilter.addEventListener('change', (e) => {
                currentStatus = e.target.value;
                loadWords(1, currentStatus, currentSearch);
            });

            searchBtn.addEventListener('click', () => {
                currentSearch = searchInput.value.trim();
                loadWords(1, currentStatus, currentSearch);
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    currentSearch = searchInput.value.trim();
                    loadWords(1, currentStatus, currentSearch);
                }
            });

            editForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const wordId = document.getElementById('edit-word-id').value;
                const data = {
                    original_word: document.getElementById('edit-original-word').value,
                    translation: document.getElementById('edit-translation').value,
                    example: document.getElementById('edit-example').value,
                    status_id: parseInt(document.getElementById('edit-status').value)
                };

                fetch(`/words/${wordId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            editModal.style.display = 'none';
                            loadWords(currentPage, currentStatus, currentSearch);
                        }
                    });
            });

            document.querySelector('.close-modal').addEventListener('click', () => {
                editModal.style.display = 'none';
            });

            window.addEventListener('click', (e) => {
                if (e.target === editModal) {
                    editModal.style.display = 'none';
                }
            });

            loadWords();
        });
    </script>
</body>

</html>
